[workspace]
name = "assetto-corsa-rally-headtracking"
version = "1.2.0"
description = "Head tracking mod for Assetto Corsa Rally (Unreal Engine 5)"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
#
# Run unconditionally. `cmake -B` is idempotent and cheap on an already
# configured tree, whereas skipping on the mere existence of build/ meant a
# configure that died partway - a dropped connection during the MinHook fetch,
# an interrupted run - left a directory that every later build, test and
# package reused and failed against, with no way back except deleting it by
# hand.
setup = "cmake -B build -A x64"

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# The game-process-free half of the mod: the frozen HeadTracking.ini reader,
# the executable path handling, the camera composition and the detour's
# clean-pose table; the committed CameraUnlock.ini against the config table and
# the saves; the config differential test, which holds the frozen reader to
# v1.1.0's and the migration into CameraUnlock.ini to the frozen reader; and
# core's canonical config lint over every file that test migrated. Runs the
# binaries directly rather than through ctest so a failing assertion's name
# reaches the console. test-unit is everything but the differential and its
# lint, which run on the release paths as test-differential.
test-unit = { cmd = "cmake --build build --config Release --target acr_ht_tests acr_ht_config_tests && build/tests/Release/acr_ht_tests.exe && build/tests/Release/acr_ht_config_tests.exe", depends-on = ["setup"] }
test-differential = { cmd = "cmake --build build --config Release --target acr_ht_config_differential && build/tests/Release/acr_ht_config_differential.exe && node tests/config_differential/lint-migrated.mjs build/tests/Release/migrated", depends-on = ["setup"] }
test = { depends-on = ["test-unit", "test-differential"] }

# Rewrites config/CameraUnlock.ini, the committed file, from the config table
# after a change to a row, a comment or a default, then writes the launcher
# manifest's config descriptor per_game from it. acr_ht_config_tests fails
# until it has run.
render-config = { cmd = "cmake --build build --config Release --target acr_ht_config_tests && build/tests/Release/acr_ht_config_tests.exe --render-config config/CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["setup"] }

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

# Dev loop: build, then copy the .asi + vendored loader straight into the
# detected game folder. install.cmd is the end-user path and is not run here -
# it pauses when it isn't given /y, and pixi allocates no stdin to read from.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

# Launch the game unattended for a fixed window, then kill it and print the
# mod's log. The whole discovery loop runs off this.
probe = "powershell -ExecutionPolicy Bypass -File scripts/probe-run.ps1"

# Bump the vendored Ultimate ASI Loader copy. Manual; commit the result.
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# -NoRefresh: packaging must not move the cameraunlock-core submodule pointer.
# Without it the packager fast-forwards the submodule to origin/main on a
# developer's machine while CI (which is exempted) uses the committed pointer,
# so the two package different core revisions - and the resulting dirty tree
# then trips release.ps1's clean-tree check. Bumping the submodule is what
# `pixi run sync` is for, and it leaves a commit behind.
# Depends on test-unit, so no ZIP is built from a tree whose unit tests fail.
# The config differential test runs on the release paths.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1 -NoRefresh", depends-on = ["build", "test-unit"] }

uninstall = "scripts/uninstall.cmd /y"

# Checks the newest release/*-installer.zip against the launcher manifest rules
# and the canonical config's delivery rules, and the Nexus ZIP for a config.
# Run after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

[dependencies]
# CMake and Visual Studio come from the system. Node runs cameraunlock-core's
# canonical config lint, its config descriptor check, which packaging calls,
# and render-config's encode-seed step, pinned to the release core's own lock
# resolves.
nodejs = "==26.5.0"
